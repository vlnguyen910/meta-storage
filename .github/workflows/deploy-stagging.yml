name: Deploy API staging

on:
  workflow_call:
    inputs:
      sha:
        description: Commit that passed quality and database checks
        required: true
        type: string
    secrets:
      HOST:
        required: true
      USERNAME:
        required: true
      SSH_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Deploy API and Worker
      uses: appleboy/ssh-action@v1.2.2
      env:
        DEPLOY_SHA: ${{ inputs.sha }}
      with:
        envs: DEPLOY_SHA
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        command_timeout: 18m
        script: |
          set -eu

          cd services/metastorage

          if ! printf '%s\n' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Invalid deployment commit"
            exit 1
          fi
          git fetch origin "$DEPLOY_SHA"
          git checkout --detach "$DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

          COMPOSE=docker/docker-compose.prod.yml

          docker compose -f "$COMPOSE" \
            --profile migrations build api worker migrate

          docker compose -f "$COMPOSE" \
            --profile migrations run --rm --no-deps migrate

          docker compose -f "$COMPOSE" \
            up -d --no-build --wait --wait-timeout 120 api worker

          docker compose -f "$COMPOSE" exec -T api bun -e '
            const response = await fetch(
              "http://127.0.0.1:4000/api/health"
            );
            const body = await response.json();

            if (
              !response.ok ||
              body.data?.database?.status !== "connected"
            ) {
              process.exit(1);
            }
          '

          WORKER_ID=$(docker compose -f "$COMPOSE" ps -q worker)
          test -n "$WORKER_ID"
          test "$(docker inspect --format '{{.State.Running}}' "$WORKER_ID")" = "true"

          echo "Staging deployment completed: $DEPLOY_SHA"
