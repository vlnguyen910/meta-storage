name: CI

on:
  push:
    branches:
    - dev
    - main
    - stagging
  pull_request:
    branches:
    - dev
    - main
    - stagging

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/stagging' }}

env:
  LOG_LEVEL: silent
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/metastorage_inspection_test_ci
  REDIS_URL: redis://127.0.0.1:6379
  CORS_ORIGIN: http://localhost:3000
  AUTH_TRUSTED_ORIGINS: http://localhost:3000
  BETTER_AUTH_SECRET: ci-only-auth-secret-32-characters-long
  BETTER_AUTH_URL: http://localhost:4000/api/auth
  BOOKING_MAGIC_LINK_SECRET: ci-only-booking-secret-32-characters
  QR_TOKEN_SECRET: ci-only-qr-secret-32-characters-long
  PUBLIC_APP_URL: http://localhost:3000
  WEB_URL: http://localhost:3000
  RESEND_API_KEY: re_ci_only
  RESEND_FROM_EMAIL: CI <ci@example.test>
  CLOUDINARY_CLOUD_NAME: ci-test-cloud
  CLOUDINARY_API_KEY: ci-test-key
  CLOUDINARY_API_SECRET: ci-only-cloudinary-secret

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    env:
      CI: true

    steps:
    - uses: actions/checkout@v5

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Cache Bun downloads
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Check formatting and linting
      run: bun run check

    - name: Type-check workspaces
      run: bun run check-types

    - name: Run unit tests
      env:
        NODE_ENV: test
        TRUSTED_PROXY_CIDRS: 127.0.0.1
      run: bun run test

    - name: Build production artifacts
      run: bun run build

    - name: Build worker Docker image
      run: docker build -f apps/worker/Dockerfile -t metastorage-worker:ci .

  database:
    name: Database regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      NODE_ENV: test
      GOOGLE_CLIENT_ID: ci-only-google-client
      GOOGLE_CLIENT_SECRET: ci-only-google-secret
      BOOKING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/metastorage_inspection_test_ci
      MY_STORAGE_LOCAL_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/metastorage_inspection_test_ci
      PRICING_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/metastorage_inspection_test_ci
      REPORTS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/metastorage_inspection_test_ci
      REDIS_URL: redis://127.0.0.1:6379/14
      REDIS_TEST_URL: redis://127.0.0.1:6379/14
      RUN_INSPECTION_DB_TESTS: "1"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metastorage_inspection_test_ci
        ports:
        - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
        - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
    - uses: actions/checkout@v5
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Apply migrations to the isolated database
      run: bun run db:migrate
    - name: Run every opted-in regression without cached results or skips
      run: bun run --filter api test:db

  deploy:
    name: Deploy checked staging commit
    needs: [quality, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/stagging'
    uses: ./.github/workflows/deploy-stagging.yml
    with:
      sha: ${{ github.sha }}
    secrets:
      HOST: ${{ secrets.HOST }}
      USERNAME: ${{ secrets.USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
